<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Question Bank</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--primary:#6366f1;--pd:#4f46e5;--green:#22c55e;--red:#ef4444;--bg:#f5f6fa;--card:#fff;--text:#1a1a2e;--muted:#64748b;--border:#e2e8f0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
  .sidebar{position:fixed;top:0;left:0;width:220px;height:100vh;background:var(--text);padding:24px 16px;display:flex;flex-direction:column;gap:6px}
  .sidebar h2{color:#fff;font-size:12px;text-transform:uppercase;letter-spacing:1px;padding:0 8px;margin-bottom:8px}
  .nav-btn{display:block;width:100%;padding:10px 12px;border:none;border-radius:8px;background:transparent;color:#a0aec0;text-align:left;cursor:pointer;font-size:13px;transition:all .15s}
  .nav-btn:hover,.nav-btn.active{background:#2d2d4e;color:#fff}
  .main{margin-left:220px;padding:32px}
  .page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
  .page-header h1{font-size:20px;font-weight:700}
  .stats{display:flex;gap:14px;margin-bottom:28px}
  .stat{flex:1;background:var(--card);border-radius:12px;padding:16px 18px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
  .stat .lbl{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.5px}
  .stat .val{font-size:26px;font-weight:700;margin-top:4px}
  .stat.pnd .val{color:#e6a817}.stat.apv .val{color:var(--green)}.stat.rej .val{color:var(--red)}.stat.tot .val{color:var(--primary)}

  /* Generate panel */
  .gen-panel{background:var(--card);border-radius:14px;padding:24px;margin-bottom:28px;box-shadow:0 1px 4px rgba(0,0,0,.06);border:2px dashed var(--border)}
  .gen-panel h3{font-size:15px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
  .form-row{display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap}
  .form-group{display:flex;flex-direction:column;gap:5px;flex:1;min-width:180px}
  .form-group label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .form-group input,.form-group select,.form-group textarea{padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;background:var(--bg);color:var(--text);transition:border-color .15s}
  .form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--primary)}
  .form-group textarea{min-height:120px;resize:vertical;line-height:1.5}
  .btn-gen{padding:10px 22px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;transition:background .15s;margin-top:4px}
  .btn-gen:hover{background:var(--pd)}.btn-gen:disabled{background:#a5b4fc;cursor:not-allowed}

  /* Filters */
  .filter-bar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;align-items:center}
  .filter-bar select{padding:7px 12px;border:1px solid var(--border);border-radius:8px;font-size:12px;background:var(--card)}

  /* Cards */
  .q-list{display:flex;flex-direction:column;gap:14px}
  .q-card{background:var(--card);border-radius:12px;padding:20px 22px;box-shadow:0 1px 4px rgba(0,0,0,.06);border-left:4px solid var(--border)}
  .q-card.pending{border-left-color:#f59e0b}.q-card.approved{border-left-color:var(--green)}.q-card.rejected{border-left-color:var(--red)}
  .q-meta{display:flex;gap:7px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
  .badge{padding:2px 9px;border-radius:99px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
  .b-mcq{background:#ede9fe;color:#6d28d9}.b-multi{background:#dbeafe;color:#1d4ed8}
  .b-tf{background:#fce7f3;color:#9d174d}.b-open{background:#fef3c7;color:#b45309}
  .b-mudah{background:#dcfce7;color:#166534}.b-sedang{background:#fef9c3;color:#854d0e}.b-sulit{background:#fee2e2;color:#991b1b}
  .b-pnd{background:#fef3c7;color:#92400e}.b-apv{background:#dcfce7;color:#14532d}.b-rej{background:#fee2e2;color:#7f1d1d}
  .topic-tag{padding:2px 9px;border-radius:99px;font-size:10px;background:#f1f5f9;color:#475569}
  .q-text{font-size:14px;line-height:1.6;margin-bottom:10px;font-weight:500}
  .q-opts{display:flex;flex-direction:column;gap:3px;margin-bottom:10px}
  .q-opt{font-size:12px;color:var(--muted);padding:3px 8px;border-radius:4px}
  .q-opt.correct{background:#dcfce7;color:#166534;font-weight:700}
  .q-ans-ref{background:#f8fafc;border-radius:7px;padding:8px 12px;font-size:12px;color:var(--muted);margin-bottom:10px}
  .q-explain{font-size:12px;color:#64748b;line-height:1.5;padding:8px 12px;background:#f8fafc;border-radius:7px;border-left:3px solid var(--primary);margin-bottom:14px}
  .q-actions{display:flex;gap:8px;align-items:center}
  .btn-ok{padding:6px 14px;background:var(--green);color:#fff;border:none;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer}
  .btn-ok:hover{background:#16a34a}
  .btn-no{padding:6px 14px;background:#f1f5f9;color:var(--muted);border:none;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer}
  .btn-no:hover{background:#fee2e2;color:var(--red)}
  .btn-del{padding:6px 12px;background:transparent;color:#cbd5e1;border:1px solid var(--border);border-radius:6px;font-size:12px;cursor:pointer}
  .btn-del:hover{background:#fee2e2;color:var(--red);border-color:#fca5a5}
  .rej-inp{display:none;margin-top:8px;width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:12px}
  .ts{font-size:10px;color:#94a3b8;margin-left:auto}
  .loading{display:flex;align-items:center;justify-content:center;padding:60px;gap:10px;color:var(--muted);font-size:13px}
  .spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .empty{text-align:center;padding:60px;color:var(--muted);font-size:13px}
  .toast{position:fixed;bottom:24px;right:24px;background:var(--text);color:#fff;padding:11px 18px;border-radius:9px;font-size:12px;opacity:0;transform:translateY(6px);transition:all .2s;pointer-events:none;z-index:999}
  .toast.show{opacity:1;transform:translateY(0)}.toast.ok{background:#166534}.toast.err{background:#991b1b}
</style>
</head>
<body>

<nav class="sidebar">
  <h2>Asah Otak Admin</h2>
  <button class="nav-btn active" onclick="nav('pending',this)">⏳ Pending Review</button>
  <button class="nav-btn" onclick="nav('approved',this)">✅ Approved</button>
  <button class="nav-btn" onclick="nav('rejected',this)">❌ Rejected</button>
  <button class="nav-btn" onclick="nav('all',this)">📋 All</button>
  <div style="margin-top:auto">
    <button class="nav-btn" onclick="nav('generate',this)">✨ Generate Questions</button>
  </div>
</nav>

<main class="main">
  <div class="page-header">
    <h1 id="page-title">Pending Review</h1>
  </div>

  <!-- Stats -->
  <div class="stats">
    <div class="stat tot"><div class="lbl">Total</div><div class="val" id="s-total">—</div></div>
    <div class="stat pnd"><div class="lbl">Pending</div><div class="val" id="s-pending">—</div></div>
    <div class="stat apv"><div class="lbl">Approved</div><div class="val" id="s-approved">—</div></div>
    <div class="stat rej"><div class="lbl">Rejected</div><div class="val" id="s-rejected">—</div></div>
  </div>

  <!-- Generate panel -->
  <div class="gen-panel" id="gen-panel" style="display:none">
    <h3>✨ Generate Soal Mingguan</h3>
    <div class="form-row">
      <div class="form-group" style="flex:0 0 200px">
        <label>Nama Topik</label>
        <input id="g-name" placeholder="e.g. Abstraksi" />
      </div>
      <div class="form-group" style="flex:0 0 160px">
        <label>Week ID (opsional)</label>
        <input id="g-week" placeholder="e.g. 2026-W20" />
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Deskripsi Topik Minggu Ini</label>
        <textarea id="g-text" placeholder="Masukkan definisi, penjelasan, dan contoh dari topik yang diajarkan minggu ini. AI akan membuat soal HANYA berdasarkan teks ini…"></textarea>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:16px;margin-top:4px">
      <button class="btn-gen" id="gen-btn" onclick="generate()">
        <span>✨</span> Generate 10 Soal
      </button>
      <span style="font-size:12px;color:var(--muted)">Akan menghasilkan 3 MCQ · 3 Multi-pilih · 2 Benar/Salah · 2 Uraian</span>
    </div>
  </div>

  <!-- Filters -->
  <div class="filter-bar" id="filter-bar">
    <select id="f-week" onchange="applyFilters()"><option value="">Semua minggu</option></select>
    <select id="f-type" onchange="applyFilters()">
      <option value="">Semua tipe</option>
      <option value="mcq">MCQ</option>
      <option value="multi">Multi-pilih</option>
      <option value="truefalse">Benar/Salah</option>
      <option value="open">Uraian</option>
    </select>
    <select id="f-diff" onchange="applyFilters()">
      <option value="">Semua kesulitan</option>
      <option value="mudah">Mudah</option>
      <option value="sedang">Sedang</option>
      <option value="sulit">Sulit</option>
    </select>
  </div>

  <div id="q-list" class="q-list"></div>
</main>

<div class="toast" id="toast"></div>

<script>
const API = '';
let view = 'pending';
let all  = [];

async function fetchStats() {
  try {
    const d = await (await fetch(`${API}/questions/stats`)).json();
    document.getElementById('s-total').textContent    = d.total    ?? '—';
    document.getElementById('s-pending').textContent  = d.pending  ?? '—';
    document.getElementById('s-approved').textContent = d.approved ?? '—';
    document.getElementById('s-rejected').textContent = d.rejected ?? '—';
    const sel = document.getElementById('f-week');
    const ex  = new Set([...sel.options].map(o=>o.value).filter(Boolean));
    Object.keys(d.by_week||{}).sort().reverse().forEach(w=>{
      if(!ex.has(w)){const o=document.createElement('option');o.value=w;o.textContent=w;sel.appendChild(o)}
    });
  } catch(e){}
}

async function fetchQuestions(status) {
  const list = document.getElementById('q-list');
  list.innerHTML = '<div class="loading"><div class="spinner"></div> Memuat…</div>';
  try {
    const url = status==='all'?`${API}/questions/all`:`${API}/questions/all?status=${status}`;
    all = (await (await fetch(url)).json()).questions||[];
    applyFilters();
  } catch(e){ list.innerHTML=`<div class="empty">Gagal memuat: ${e.message}</div>`; }
}

function applyFilters(){
  let qs=all;
  const w=document.getElementById('f-week').value;
  const t=document.getElementById('f-type').value;
  const d=document.getElementById('f-diff').value;
  if(w) qs=qs.filter(q=>q.week_id===w);
  if(t) qs=qs.filter(q=>q.type===t);
  if(d) qs=qs.filter(q=>q.difficulty===d);
  render(qs);
}

const TYPE_LABELS = {mcq:'MCQ',multi:'Multi-pilih',truefalse:'Benar/Salah',open:'Uraian'};
const TYPE_CLS    = {mcq:'b-mcq',multi:'b-multi',truefalse:'b-tf',open:'b-open'};

function render(qs){
  const list=document.getElementById('q-list');
  if(!qs.length){list.innerHTML='<div class="empty">Tidak ada soal.</div>';return;}
  list.innerHTML=qs.map(q=>card(q)).join('');
}

function card(q){
  const tc  = TYPE_CLS[q.type]||'b-open';
  const tl  = TYPE_LABELS[q.type]||q.type;
  const ts  = q.created_at?new Date(q.created_at).toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}):'';

  // Options rendering
  let optsHtml = '';
  if(q.options && q.type!=='open'){
    const correctSet = q.type==='multi'
      ? new Set((q.correct_answers||q.correct_answer||[]).map(c=>String(c).toUpperCase()))
      : new Set([String(q.correct_answer).toUpperCase()]);
    optsHtml = '<div class="q-opts">'
      + Object.entries(q.options).map(([k,v])=>
          `<div class="q-opt ${correctSet.has(k.toUpperCase())?'correct':''}"><strong>${k}.</strong> ${esc(v)}`
          + (correctSet.has(k.toUpperCase())?' ✓':'')+`</div>`
        ).join('')
      +'</div>';
  }

  // Answer ref for open
  const ansRef = q.type==='open'
    ? `<div class="q-ans-ref"><strong>Jawaban Referensi:</strong> ${esc(q.correct_answer||'')}</div>` : '';

  // Actions
  const actions = q.status==='pending'
    ? `<button class="btn-ok" onclick="approve('${q.id}')">✓ Approve</button>
       <button class="btn-no" onclick="toggleRej('${q.id}')">✗ Reject</button>
       <input class="rej-inp" id="ri-${q.id}" placeholder="Alasan (opsional)" onkeydown="if(event.key==='Enter')doReject('${q.id}')">
       <button class="btn-del" onclick="del('${q.id}')">🗑</button>`
    : `<button class="btn-del" onclick="del('${q.id}')">🗑</button>`;

  return `<div class="q-card ${q.status}" id="card-${q.id}">
    <div class="q-meta">
      <span class="badge ${tc}">${tl}</span>
      <span class="badge b-${q.difficulty}">${q.difficulty}</span>
      <span class="badge b-${q.status==='pending'?'pnd':q.status==='approved'?'apv':'rej'}">${q.status}</span>
      <span class="topic-tag">${esc(q.topic||'')}</span>
      <span class="topic-tag">${esc(q.week_id||'')}</span>
    </div>
    <div class="q-text">${esc(q.question||'')}</div>
    ${optsHtml}${ansRef}
    ${q.explanation?`<div class="q-explain"><strong>Pembahasan:</strong> ${esc(q.explanation)}</div>`:''}
    <div class="q-actions">${actions}<span class="ts">${ts}</span></div>
  </div>`;
}

async function approve(id){
  try{
    const r=await fetch(`${API}/questions/${id}/approve`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({admin_note:''})});
    if(!r.ok) throw new Error(await r.text());
    toast('Approved ✓','ok'); removeCard(id); fetchStats();
  }catch(e){toast('Error: '+e.message,'err');}
}

function toggleRej(id){
  const inp=document.getElementById(`ri-${id}`);
  inp.style.display=inp.style.display==='block'?'none':'block';
  if(inp.style.display==='block') inp.focus();
}

async function doReject(id){
  const reason=document.getElementById(`ri-${id}`).value;
  try{
    const r=await fetch(`${API}/questions/${id}/reject`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reason})});
    if(!r.ok) throw new Error(await r.text());
    toast('Rejected','ok'); removeCard(id); fetchStats();
  }catch(e){toast('Error: '+e.message,'err');}
}

async function del(id){
  if(!confirm('Hapus soal ini permanen?')) return;
  try{
    const r=await fetch(`${API}/questions/${id}`,{method:'DELETE'});
    if(!r.ok) throw new Error(await r.text());
    toast('Dihapus','ok'); removeCard(id); fetchStats();
  }catch(e){toast('Error: '+e.message,'err');}
}

async function generate(){
  const name=document.getElementById('g-name').value.trim();
  const text=document.getElementById('g-text').value.trim();
  const week=document.getElementById('g-week').value.trim();
  if(!name){alert('Masukkan nama topik.');return;}
  if(text.length<50){alert('Deskripsi topik terlalu pendek (min 50 karakter).');return;}
  const btn=document.getElementById('gen-btn');
  btn.disabled=true;
  btn.innerHTML='<div class="spinner"></div> Generating… (1-3 menit)';
  try{
    const body={topic_name:name,topic_text:text};
    if(week) body.week_id=week;
    const r=await fetch(`${API}/questions/generate`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d=await r.json();
    if(!r.ok) throw new Error(d.detail||JSON.stringify(d));
    toast(`${d.generated} soal dibuat untuk ${d.week_id} ✓`,'ok');
    fetchStats();
  }catch(e){toast('Gagal: '+e.message,'err');}
  finally{btn.disabled=false;btn.innerHTML='<span>✨</span> Generate 10 Soal';}
}

function nav(v, el){
  view=v;
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  const titles={pending:'Pending Review',approved:'Approved',rejected:'Rejected',all:'All Questions',generate:'Generate Soal'};
  document.getElementById('page-title').textContent=titles[v]||v;
  const genPanel=document.getElementById('gen-panel');
  const filterBar=document.getElementById('filter-bar');
  const qList=document.getElementById('q-list');
  if(v==='generate'){
    genPanel.style.display='block';
    filterBar.style.display='none';
    qList.innerHTML='';
  } else {
    genPanel.style.display='none';
    filterBar.style.display='flex';
    fetchQuestions(v);
  }
}

function removeCard(id){
  all=all.filter(q=>q.id!==id);
  document.getElementById(`card-${id}`)?.remove();
  if(!document.querySelectorAll('.q-card').length)
    document.getElementById('q-list').innerHTML='<div class="empty">Tidak ada soal.</div>';
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

let tt;
function toast(m,t=''){
  const el=document.getElementById('toast');
  el.textContent=m; el.className=`toast show ${t}`;
  clearTimeout(tt); tt=setTimeout(()=>el.className='toast',3000);
}

fetchStats();
fetchQuestions('pending');
</script>
</body>
</html>
